<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ROBCO WEBSITE HUB</title>

  <style>
    :root {
      --green: #55ff55;
      --dark-green: #159615;
      --black: #020602;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      background:
        radial-gradient(circle, #102010 0%, #020602 70%);
      color: var(--green);
      font-family: "Courier New", monospace;
      text-shadow: 0 0 6px var(--green);
    }

    /* CRT scanlines */
    body::after {
      content: "";
      position: fixed;
      inset: 0;
      pointer-events: none;
      background:
        repeating-linear-gradient(
          0deg,
          rgba(255,255,255,.025),
          rgba(255,255,255,.025) 1px,
          transparent 1px,
          transparent 4px
        );
    }

    .terminal {
      width: min(1000px, 94%);
      min-height: 90vh;
      margin: 5vh auto;
      padding: 25px;
      border: 2px solid var(--green);
      box-shadow:
        0 0 10px var(--green),
        inset 0 0 25px rgba(50,255,50,.08);
      background: rgba(2,8,2,.95);
    }

    .header {
      border-bottom: 1px solid var(--dark-green);
      padding-bottom: 15px;
      margin-bottom: 25px;
    }

    .title {
      font-size: clamp(22px, 4vw, 36px);
      font-weight: bold;
    }

    .subtitle {
      opacity: .7;
      margin-top: 5px;
    }

    .login {
      max-width: 550px;
      margin: 12vh auto;
      text-align: center;
    }

    input {
      width: 100%;
      padding: 14px;
      margin-top: 10px;

      background: #010401;
      border: 1px solid var(--green);
      color: var(--green);

      font-family: inherit;
      font-size: 16px;

      outline: none;
      box-shadow: 0 0 5px var(--dark-green);
    }

    button {
      padding: 12px 18px;
      margin-top: 10px;

      background: #061006;
      border: 1px solid var(--green);
      color: var(--green);

      font-family: inherit;
      font-size: 15px;

      cursor: pointer;

      text-shadow: 0 0 6px var(--green);
      box-shadow: 0 0 5px var(--dark-green);

      transition: .15s;
    }

    button:hover {
      background: #123012;
      box-shadow:
        0 0 8px var(--green),
        0 0 20px var(--dark-green);
    }

    .login button {
      width: 100%;
    }

    .message {
      min-height: 25px;
      margin-top: 15px;
    }

    .hidden {
      display: none !important;
    }

    .search {
      display: flex;
      gap: 10px;
    }

    .search input {
      margin: 0;
    }

    .logout {
      white-space: nowrap;
    }

    .categories {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin: 20px 0;
    }

    .sites {
      display: grid;
      grid-template-columns:
        repeat(auto-fit, minmax(210px, 1fr));
      gap: 15px;
    }

    .site {
      padding: 18px;

      border: 1px solid var(--dark-green);
      background: #061006;

      cursor: pointer;

      transition: .15s;
    }

    .site:hover {
      border-color: var(--green);
      box-shadow:
        0 0 8px var(--green),
        0 0 20px var(--dark-green);

      transform: translateY(-2px);
    }

    .site-name {
      font-size: 18px;
      font-weight: bold;
    }

    .site-category {
      margin-top: 8px;
      opacity: .65;
      font-size: 13px;
    }

    .footer {
      margin-top: 35px;
      opacity: .5;
      font-size: 12px;
    }
  </style>
</head>

<body>

<div class="terminal">

  <div class="header">
    <div class="title">
      ROBCO INDUSTRIES // WEBSITE HUB
    </div>

    <div class="subtitle">
      TERMINAL BUILD 1.0 // VAULT-TEC NETWORK
    </div>
  </div>


  <!-- LOGIN -->

  <section id="loginScreen" class="login">

    <h1>☢ ACCESS TERMINAL</h1>

    <p>
      AUTHORIZATION REQUIRED
    </p>

    <input
      id="accessCode"
      placeholder="ENTER ACCESS CODE"
      autocomplete="off"
    >

    <button onclick="login()">
      AUTHENTICATE
    </button>

    <div
      id="loginMessage"
      class="message"
    ></div>

  </section>


  <!-- WEBSITE HUB -->

  <section
    id="hub"
    class="hidden"
  >

    <div class="search">

      <input
        id="search"
        placeholder="SEARCH DATABASE..."
        oninput="renderSites()"
      >

      <button
        class="logout"
        onclick="logout()"
      >
        LOG OUT
      </button>

    </div>


    <div
      id="categories"
      class="categories"
    ></div>


    <div
      id="sites"
      class="sites"
    ></div>


    <div class="footer">

      ROBCO INDUSTRIES (TM)

      <br>

      UNAUTHORIZED ACCESS IS A FEDERAL OFFENSE

    </div>

  </section>

</div>


<script>

  /*
    ==========================================
       SUPABASE CONNECTION
    ==========================================

    IMPORTANT:

    Replace the placeholder below with your
    Supabase PUBLISHABLE key.

    NEVER put your service_role / secret key here.
  */

  const SUPABASE_URL =
    "https://jkvjwrylzbhtrjesgrxi.supabase.co";

  const SUPABASE_KEY =
    "sb_publishable_TCJ6M82hMRFbXc40djvk9Q_oA41lSvn";


  let websites = [];

  let currentCategory = "ALL";


  /*
    ==========================================
       DATABASE REQUEST
    ==========================================
  */

  async function databaseRequest(
    endpoint,
    options = {}
  ) {

    const response = await fetch(
      SUPABASE_URL + endpoint,
      {

        ...options,

        headers: {

          "apikey":
            SUPABASE_KEY,

          "Authorization":
            "Bearer " + SUPABASE_KEY,

          "Content-Type":
            "application/json",

          ...(options.headers || {})

        }

      }
    );

    return response;

  }


  /*
    ==========================================
       LOGIN
    ==========================================
  */

  async function login() {

    const code =
      document
        .getElementById("accessCode")
        .value
        .trim();


    const message =
      document
        .getElementById("loginMessage");


    if (!code) {

      message.textContent =
        "ENTER AN ACCESS CODE.";

      return;

    }


    message.textContent =
      "AUTHENTICATING...";


    try {

      const response =
        await databaseRequest(
          "/rest/v1/rpc/use_access_code",
          {

            method: "POST",

            body:
              JSON.stringify({

                input_code: code

              })

          }
        );


      const result =
        await response.json();


      if (
        response.ok &&
        result.success
      ) {

        message.textContent =
          "ACCESS GRANTED.";

        document
          .getElementById("loginScreen")
          .classList.add("hidden");


        document
          .getElementById("hub")
          .classList.remove("hidden");


        loadWebsites();

      }

      else {

        message.textContent =
          result.message ||
          "ACCESS DENIED.";

      }

    }

    catch (error) {

      console.error(error);

      message.textContent =
        "CONNECTION ERROR.";

    }

  }


  /*
    ==========================================
       LOAD WEBSITES
    ==========================================
  */

  async function loadWebsites() {

    try {

      const response =
        await databaseRequest(
          "/rest/v1/websites?active=eq.true&select=id,name,url,category&order=name"
        );


      if (!response.ok) {

        throw new Error(
          "Database request failed"
        );

      }


      websites =
        await response.json();


      renderCategories();

      renderSites();

    }

    catch (error) {

      console.error(error);

      document
        .getElementById("sites")
        .innerHTML =
        "<p>DATABASE CONNECTION ERROR.</p>";

    }

  }


  /*
    ==========================================
       CATEGORIES
    ==========================================
  */

  function renderCategories() {

    const categories =
      [
        "ALL",
        ...new Set(
          websites
            .map(site => site.category)
            .filter(Boolean)
        )
      ];


    document
      .getElementById("categories")
      .innerHTML =
        categories
          .map(category => `

            <button
              onclick="selectCategory('${escapeHTML(category)}')"
            >

              ${escapeHTML(category)}

            </button>

          `)
          .join("");

  }


  function selectCategory(category) {

    currentCategory =
      category;

    renderSites();

  }


  /*
    ==========================================
       DISPLAY WEBSITES
    ==========================================
  */

  function renderSites() {

    const search =
      document
        .getElementById("search")
        .value
        .toLowerCase();


    const filtered =
      websites.filter(site => {

        const matchesCategory =
          currentCategory === "ALL" ||
          site.category === currentCategory;


        const matchesSearch =
          (
            site.name +
            " " +
            site.url +
            " " +
            site.category
          )
          .toLowerCase()
          .includes(search);


        return (
          matchesCategory &&
          matchesSearch
        );

      });


    const container =
      document
        .getElementById("sites");


    if (!filtered.length) {

      container.innerHTML =
        "<p>NO RECORDS FOUND.</p>";

      return;

    }


    container.innerHTML =
      filtered
        .map(site => `

          <div
            class="site"
            onclick="openWebsite('${escapeAttribute(site.url)}')"
          >

            <div class="site-name">
              ${escapeHTML(site.name)}
            </div>

            <div class="site-category">
              ${escapeHTML(site.category || "MISC")}
            </div>

          </div>

        `)
        .join("");

  }


  /*
    ==========================================
       OPEN WEBSITE
    ==========================================
  */

  function openWebsite(url) {

    try {

      const parsed =
        new URL(url);


      if (
        parsed.protocol !== "https:" &&
        parsed.protocol !== "http:"
      ) {

        return;

      }


      window.open(
        parsed.href,
        "_blank",
        "noopener,noreferrer"
      );

    }

    catch {

      console.error(
        "Invalid website URL"
      );

    }

  }


  /*
    ==========================================
       LOG OUT
    ==========================================
  */

  function logout() {

    websites = [];

    currentCategory = "ALL";


    document
      .getElementById("hub")
      .classList.add("hidden");


    document
      .getElementById("loginScreen")
      .classList.remove("hidden");


    document
      .getElementById("accessCode")
      .value = "";


    document
      .getElementById("loginMessage")
      .textContent = "";

  }


  /*
    ==========================================
       SECURITY HELPERS
    ==========================================
  */

  function escapeHTML(value) {

    return String(value ?? "")
      .replace(
        /[&<>"']/g,
        character => ({

          "&": "&amp;",
          "<": "&lt;",
          ">": "&gt;",
          '"': "&quot;",
          "'": "&#039;"

        }[character])

      );

  }


  function escapeAttribute(value) {

    return String(value ?? "")
      .replace(
        /'/g,
        "%27"
      );

  }


  /*
    ENTER KEY LOGIN
  */

  document
    .getElementById("accessCode")
    .addEventListener(
      "keydown",
      event => {

        if (
          event.key === "Enter"
        ) {

          login();

        }

      }
    );

</script>

</body>
</html>
