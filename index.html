<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ROBCO WEBSITE HUB</title>

  <style>
    :root {
      --green: #55ff55;
      --dark-green: #159615;
      --black: #020602;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      background:
        radial-gradient(circle, #102010 0%, #020602 70%);
      color: var(--green);
      font-family: "Courier New", monospace;
      text-shadow: 0 0 6px var(--green);
    }

    /* CRT scanlines */
    body::after {
      content: "";
      position: fixed;
      inset: 0;
      pointer-events: none;
      background:
        repeating-linear-gradient(
          0deg,
          rgba(255,255,255,.025),
          rgba(255,255,255,.025) 1px,
          transparent 1px,
          transparent 4px
        );
    }

    .terminal {
      width: min(1000px, 94%);
      min-height: 90vh;
      margin: 5vh auto;
      padding: 25px;
      border: 2px solid var(--green);
      box-shadow:
        0 0 10px var(--green),
        inset 0 0 25px rgba(50,255,50,.08);
      background: rgba(2,8,2,.95);
    }

    .header {
      border-bottom: 1px solid var(--dark-green);
      padding-bottom: 15px;
      margin-bottom: 25px;
    }

    .title {
      font-size: clamp(22px, 4vw, 36px);
      font-weight: bold;
    }

    .subtitle {
      opacity: .7;
      margin-top: 5px;
    }

    .login {
      max-width: 550px;
      margin: 12vh auto;
      text-align: center;
    }

    input {
      width: 100%;
      padding: 14px;
      margin-top: 10px;

      background: #010401;
      border: 1px solid var(--green);
      color: var(--green);

      font-family: inherit;
      font-size: 16px;

      outline: none;
      box-shadow: 0 0 5px var(--dark-green);
    }

    button {
      padding: 12px 18px;
      margin-top: 10px;

      background: #061006;
      border: 1px solid var(--green);
      color: var(--green);

      font-family: inherit;
      font-size: 15px;

      cursor: pointer;

      text-shadow: 0 0 6px var(--green);
      box-shadow: 0 0 5px var(--dark-green);

      transition: .15s;
    }

    button:hover {
      background: #123012;
      box-shadow:
        0 0 8px var(--green),
        0 0 20px var(--dark-green);
    }

    .login button {
      width: 100%;
    }

    .message {
      min-height: 25px;
      margin-top: 15px;
    }

    .hidden {
      display: none !important;
    }

    .search {
      display: flex;
      gap: 10px;
    }

    .search input {
      margin: 0;
    }

    .logout {
      white-space: nowrap;
    }

    .categories {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin: 20px 0;
    }

    .sites {
      display: grid;
      grid-template-columns:
        repeat(auto-fit, minmax(210px, 1fr));
      gap: 15px;
    }

    .site {
      padding: 18px;

      border: 1px solid var(--dark-green);
      background: #061006;

      cursor: pointer;

      transition: .15s;
    }

    .site:hover {
      border-color: var(--green);
      box-shadow:
        0 0 8px var(--green),
        0 0 20px var(--dark-green);

      transform: translateY(-2px);
    }

    .site-name {
      font-size: 18px;
      font-weight: bold;
    }

    .site-category {
      margin-top: 8px;
      opacity: .65;
      font-size: 13px;
    }

    .footer {
      margin-top: 35px;
      opacity: .5;
      font-size: 12px;
    }
  </style>
</head>

<body>

<div class="terminal">

  <div class="header">
    <div class="title">
      ROBCO INDUSTRIES // WEBSITE HUB
    </div>

    <div class="subtitle">
      TERMINAL BUILD 1.0 // VAULT-TEC NETWORK

  </div>


  <!-- LOGIN -->

  <section id="loginScreen" class="login">

      AUTHORIZATION REQUIRED
    </p>

      id="accessCode"

  <section
    id="hub"

  >

        id="search"
        placeholder="SEARCH DATABASE..."
        oninput="renderSites()"
      >

      <button
        class="logout"
        onclick="logout()"
      >
        LOG OUT
      </button>

    </div>


    <div
      id="categories"
      class="categories"
    ></div>


    <div
      id="sites"
      class="sites"
    ></div>


    <div class="footer">

      ROBCO INDUSTRIES (TM)

      <br>

      UNAUTHORIZED ACCESS IS A FEDERAL OFFENSE

    </div>

  </section>

</div>


<script>

  /*
    ==========================================
       SUPABASE CONNECTION
    ==========================================

    IMPORTANT:

    Replace the placeholder below with your
    Supabase PUBLISHABLE key.

    NEVER put your service_role / secret key here.
  */

  const SUPABASE_URL =
    "https://jkvjwrylzbhtrjesgrxi.supabase.co";

  const SUPABASE_KEY =
    "sb_publishable_TCJ6M82hMRFbXc40djvk9Q_oA41lSvn";

  let websites = [];

  let currentCategory = "ALL";


  /*
    ==========================================
       DATABASE REQUEST
    ==========================================
  */

  async function databaseRequest(
    endpoint,
    options = {}
  ) {

    const response = await fetch(
      SUPABASE_URL + endpoint,
      {

        ...options,

        headers: {

          "apikey":
            SUPABASE_KEY,

          "Authorization":
            "Bearer " + SUPABASE_KEY,

          "Content-Type":
            "application/json",

          ...(options.headers || {})

        }

      }
    );

    return response;

  }


  /*
    ==========================================
       LOGIN
    ==========================================
  */

  async function login() {

    const code =
      document
        .getElementById("accessCode")
        .value
        .trim();
    
    // ☢️ SECRET OVERSEER COMMAND
if (code.toLowerCase() === "overseer") {
  showOverseerLogin();
  return;
}


    const message =
      document
        .getElementById("loginMessage");


    if (!code) {

      message.textContent =
        "ENTER AN ACCESS CODE.";

      return;

    }


    message.textContent =
      "AUTHENTICATING...";


    try {

      const response =
        await databaseRequest(
          "/rest/v1/rpc/use_access_code",
          {

            method: "POST",

            body:
              JSON.stringify({

                input_code: code

              })

          }
        );


      const result =
        await response.json();


      if (
        response.ok &&
        result.success
      ) {

        message.textContent =
          "ACCESS GRANTED.";

        document
          .getElementById("loginScreen")
          .classList.add("hidden");


        document
          .getElementById("hub")
          .classList.remove("hidden");


        loadWebsites();

      }

      else {

        message.textContent =
          result.message ||
          "ACCESS DENIED.";

      }

    }

    catch (error) {

      console.error(error);

      message.textContent =
        "CONNECTION ERROR.";

    }

  }


  /*
    ==========================================
       LOAD WEBSITES
    ==========================================
  */

  async function loadWebsites() {

    try {

      const response =
        await databaseRequest(
          "/rest/v1/websites?active=eq.true&select=id,name,url,category&order=name"
        );


      if (!response.ok) {

        throw new Error(
          "Database request failed"
        );

      }


      websites =
        await response.json();


      renderCategories();

      renderSites();

    }

    catch (error) {

      console.error(error);

      document
        .getElementById("sites")
        .innerHTML =
        "<p>DATABASE CONNECTION ERROR.</p>";

    }

  }


  /*
    ==========================================
       CATEGORIES
    ==========================================
  */

  function renderCategories() {

    const categories =
      [
        "ALL",
        ...new Set(
          websites
            .map(site => site.category)
            .filter(Boolean)
        )
      ];


    document
      .getElementById("categories")
      .innerHTML =
        categories
          .map(category => `

            <button
              onclick="selectCategory('${escapeHTML(category)}')"
            >

              ${escapeHTML(category)}

            </button>

          `)
          .join("");

  }


  function selectCategory(category) {

    currentCategory =
      category;

    renderSites();

  }


  /*
    ==========================================
       DISPLAY WEBSITES
    ==========================================
  */

  function renderSites() {

    const search =
      document
        .getElementById("search")
        .value
        .toLowerCase();


    const filtered =
      websites.filter(site => {

        const matchesCategory =
          currentCategory === "ALL" ||
          site.category === currentCategory;


        const matchesSearch =
          (
            site.name +
            " " +
            site.url +
            " " +
            site.category
          )
          .toLowerCase()
          .includes(search);


        return (
          matchesCategory &&
          matchesSearch
        );

      });


    const container =
      document
        .getElementById("sites");


    if (!filtered.length) {

      container.innerHTML =
        "<p>NO RECORDS FOUND.</p>";

      return;

    }


    container.innerHTML =
      filtered
        .map(site => `

          <div
            class="site"
            onclick="openWebsite('${escapeAttribute(site.url)}')"
          >

            <div class="site-name">
              ${escapeHTML(site.name)}
            </div>

            <div class="site-category">
              ${escapeHTML(site.category || "MISC")}
            </div>

          </div>

        `)
        .join("");

  }


  /*
    ==========================================
       OPEN WEBSITE
    ==========================================
  */

  function openWebsite(url) {

    try {

      const parsed =
        new URL(url);


      if (
        parsed.protocol !== "https:" &&
        parsed.protocol !== "http:"
      ) {

        return;

      }


      window.open(
        parsed.href,
        "_blank",
        "noopener,noreferrer"
      );

    }

    catch {

      console.error(
        "Invalid website URL"
      );

    }

  }


  /*
    ==========================================
       LOG OUT
    ==========================================
  */

  function logout() {

    websites = [];

    currentCategory = "ALL";


    document
      .getElementById("hub")
      .classList.add("hidden");


    document
      .getElementById("loginScreen")
      .classList.remove("hidden");


    document
      .getElementById("accessCode")
      .value = "";


    document
      .getElementById("loginMessage")
      .textContent = "";

  }


  /*
    ==========================================
       SECURITY HELPERS
    ==========================================
  */

  function escapeHTML(value) {

    return String(value ?? "")
      .replace(
        /[&<>"']/g,
        character => ({

          "&": "&amp;",
          "<": "&lt;",
          ">": "&gt;",
          '"': "&quot;",
          "'": "&#039;"

        }[character])

      );

  }


  function escapeAttribute(value) {

    return String(value ?? "")
      .replace(
        /'/g,
        "%27"
      );

  }


  /*
    ENTER KEY LOGIN
  */

  document
    .getElementById("accessCode")
    .addEventListener(
      "keydown",
      event => {

        if (
          event.key === "Enter"
        ) {

          login();

        }

      }
    );

  function showOverseerLogin() {

  document.getElementById("loginScreen").innerHTML = `
    <div class="login">

      <h1>☢ OVERSEER TERMINAL</h1>

      <p>ROBCO ADMINISTRATIVE ACCESS</p>

      <input
        id="overseerEmail"
        type="email"
        placeholder="OVERSEER EMAIL"
        autocomplete="username"
      >

      <input
        id="overseerPassword"
        type="password"
        placeholder="OVERSEER PASSWORD"
        autocomplete="current-password"
      >

      <button onclick="overseerLogin()">
        AUTHENTICATE
      </button>

      <button onclick="location.reload()">
        RETURN
      </button>

      <div
        id="overseerMessage"
        class="message"
      ></div>

    </div>
  `;

}


async function overseerLogin() {

  const email =
    document
      .getElementById("overseerEmail")
      .value
      .trim();

  const password =
    document
      .getElementById("overseerPassword")
      .value;


  const message =
    document
      .getElementById("overseerMessage");


  message.textContent =
    "AUTHENTICATING OVERSEER...";


  try {

    const response =
      await fetch(
        SUPABASE_URL +
        "/auth/v1/token?grant_type=password",
        {

          method: "POST",

          headers: {

            "apikey":
              SUPABASE_KEY,

            "Content-Type":
              "application/json"

          },

          body:
            JSON.stringify({

              email: email,
              password: password

            })

        }
      );


    const result =
      await response.json();


    if (!response.ok) {

      message.textContent =
        "OVERSEER AUTHENTICATION FAILED.";

      return;

    }


    // Check that this account is actually
    // registered as an Overseer.

    const check =
      await fetch(
        SUPABASE_URL +
        "/rest/v1/overseers?user_id=eq." +
        encodeURIComponent(result.user.id) +
        "&select=user_id",
        {

          headers: {

            "apikey":
              SUPABASE_KEY,

            "Authorization":
              "Bearer " +
              result.access_token

          }

        }
      );


    const overseers =
      await check.json();


    if (
      !check.ok ||
      !overseers.length
    ) {

      message.textContent =
        "ACCESS DENIED: NOT AN OVERSEER.";

      return;

    }


    message.textContent =
      "OVERSEER ACCESS GRANTED.";


    // Save the authenticated session.

    window.overseerSession = result;


    // Open the Overseer terminal.

    showOverseerPanel();

  }

  catch (error) {

    console.error(error);

    message.textContent =
      "SYSTEM CONNECTION ERROR.";

  }

}

  function showOverseerPanel() {

  document.getElementById("loginScreen").innerHTML = `

    <div class="login">

      <h1>☢ OVERSEER TERMINAL</h1>

      <p>

      </p>

      <hr>

</button>

  `;

}

  async function generateGuestCode() {

  const output =
    document.getElementById("overseerOutput");

  output.textContent =
    "GENERATING ACCESS CODE...";

  try {

    const response =
      await fetch(
        SUPABASE_URL +
        "/rest/v1/rpc/create_access_code",
        {

          method: "POST",

          headers: {

            "apikey":
              SUPABASE_KEY,

            "Authorization":
              "Bearer " +
              window.overseerSession.access_token,

            "Content-Type":
              "application/json"

          }

        }
      );

    async function viewAccessCodes() {

  const output =
    document.getElementById("overseerOutput");

  output.innerHTML =
    "LOADING ACCESS CODE DATABASE...";

  try {

    const response =
      await fetch(
        SUPABASE_URL +
        "/rest/v1/rpc/overseer_view_codes",
        {

          method: "POST",

          headers: {

            "apikey":
              SUPABASE_KEY,

            "Authorization":
              "Bearer " +
              window.overseerSession.access_token,

            "Content-Type":
              "application/json"

          },

        body: JSON.stringify({
  request: "generate"
})

        }
      );


    const codes =
      await response.json();


    if (!response.ok) {

      output.textContent =
        "DATABASE ACCESS FAILED.";

      console.error(codes);

      return;

    }


    if (!codes.length) {

      output.innerHTML =
        "<p>NO ACCESS CODES FOUND.</p>";

      return;

    }


    output.innerHTML = `

      <h3>☢ ACCESS CODE DATABASE</h3>

      <div id="codeDatabase"></div>

    `;


    const database =
      document.getElementById(
        "codeDatabase"
      );


    database.innerHTML =
      codes.map(code => {

        let status;

        if (code.uses_remaining <= 0) {

          status = "EXPIRED";

        }

        else if (!code.active) {

          status = "DEACTIVATED";

        }

        else {

          status = "ACTIVE";

        }


        let action = "";


        if (
          code.uses_remaining > 0 &&
          code.active
        ) {

          action = `

            <button
              onclick="deactivateCode('${code.id}')"
            >
              DEACTIVATE
            </button>

          `;

        }

        else if (
          code.uses_remaining > 0 &&
          !code.active
        ) {

          action = `

            <button
              onclick="reactivateCode('${code.id}')"
            >
              REACTIVATE
            </button>

          `;

        }


        return `

          <div
            style="
              border:1px solid #159615;
              padding:15px;
              margin:10px 0;
            "
          >

            <strong>
              CODE:
              ${escapeHTML(
                code.access_code ||
                "UNKNOWN / LEGACY CODE"
              )}
            </strong>

            <br>

            USES:
            ${code.uses_remaining}

            <br>

            STATUS:
            ${status}

            <br>

            CREATED:
            ${new Date(
              code.created_at
            ).toLocaleString()}

            <br>

            ${
              code.last_used_at
                ? "LAST USED: " +
                  new Date(
                    code.last_used_at
                  ).toLocaleString()
                : "LAST USED: NEVER"
            }

            <br>

            ${action}

          </div>

        `;

      }).join("");

  }

  catch (error) {

    console.error(error);

    output.textContent =
      "SYSTEM ERROR.";

  }

}

    async function deactivateCode(id) {

    "DEACTIVATE THIS ACCESS CODE?"

    return;

  const response =
    await fetch(
      SUPABASE_URL +
      "/rest/v1/rpc/deactivate_access_code",
      {

        method: "POST",

        headers: {

          "apikey":
            SUPABASE_KEY,

          "Authorization":
            "Bearer " +
            window.overseerSession.access_token,

          "Content-Type":
            "application/json"

        },

        body:
          JSON.stringify({
            code_id: id
          })

      }
    );


  if (response.ok) {

    viewAccessCodes();

  }

  else {

    alert(
      "FAILED TO DEACTIVATE CODE."
    );

  }

}

}


    const code =

    if (!response.ok) {

    output.innerHTML = `

async function addWebsite() {

  const name =
    document.getElementById("newSiteName")
      .value.trim();

  const url =
    document.getElementById("newSiteURL")
      .value.trim();

  const category =
    document.getElementById("newSiteCategory")
      .value.trim()
      .toUpperCase();


  if (!name || !url || !category) {

    document.getElementById("overseerOutput")
      .insertAdjacentHTML(
        "beforeend",
        "<p>ALL FIELDS REQUIRED.</p>"
      );

    return;

  }


  const response =
    await fetch(
      SUPABASE_URL +
      "/rest/v1/websites",
      {

        method: "POST",

        headers: {

          "apikey":
            SUPABASE_KEY,

          "Authorization":
            "Bearer " +
            window.overseerSession.access_token,

          "Content-Type":
            "application/json",

          "Prefer":
            "return=minimal"

        },

        body:
          JSON.stringify({

            name: name,
            url: url,
            category: category,
            active: true

          })

      }
    );


  if (response.ok) {

    document.getElementById("overseerOutput")
      .innerHTML =
      "☢ WEBSITE ADDED SUCCESSFULLY.";

  }

  else {

    document.getElementById("overseerOutput")
      .innerHTML =
      "DATABASE REJECTED REQUEST.";

  }

}

          "Content-Type": "application/json"
        },

        body: "{}"
      }
    );

    const codes = await response.json();

    if (!response.ok) {

      console.error(codes);

      output.innerHTML =
        "☢ DATABASE ACCESS FAILED.";

      return;
    }

    if (!codes.length) {

      output.innerHTML =
        "☢ NO ACCESS CODES FOUND.";

      return;
    }

    output.innerHTML = `
      <h3>☢ ACCESS CODE DATABASE</h3>
      <div id="codeDatabase"></div>
    `;

    const database =
      document.getElementById("codeDatabase");

    codes.forEach(code => {

      let status;

      if (code.uses_remaining <= 0) {
        status = "EXPIRED";
      }
      else if (!code.active) {
        status = "DEACTIVATED";
      }
      else {
        status = "ACTIVE";
      }

      const card =
        document.createElement("div");

      card.style.border =
        "1px solid #159615";

      card.style.padding =
        "15px";

      card.style.margin =
        "10px 0";

      const title =
        document.createElement("strong");

      title.textContent =
        "CODE: " +
        (code.access_code ||
         "UNKNOWN / LEGACY CODE");

      card.appendChild(title);

      card.appendChild(
        document.createElement("br")
      );

      card.appendChild(
        document.createTextNode(
          "USES: " +
          code.uses_remaining
        )
      );

      card.appendChild(
        document.createElement("br")
      );

      card.appendChild(
        document.createTextNode(
          "STATUS: " + status
        )
      );

      card.appendChild(
        document.createElement("br")
      );

      if (
        code.uses_remaining > 0 &&
        code.active
      ) {

        const button =
          document.createElement("button");

        button.textContent =
          "DEACTIVATE";

        button.onclick = () =>
          deactivateCode(code.id);

        card.appendChild(button);

      }
      else if (
        code.uses_remaining > 0 &&
        !code.active
      ) {

        const button =
          document.createElement("button");

        button.textContent =
          "REACTIVATE";

        button.onclick = () =>
          reactivateCode(code.id);

        card.appendChild(button);
      }

      database.appendChild(card);

    });

  }

  catch (error) {

    console.error(error);

    output.innerHTML =
      "☢ SYSTEM ERROR.";

  }

}
  
async function deactivateCode(id) {

  const response = await fetch(
    SUPABASE_URL +
    "/rest/v1/rpc/deactivate_access_code",
    {
      method: "POST",

      headers: {
        "apikey": SUPABASE_KEY,
        "Authorization":
          "Bearer " +
          window.overseerSession.access_token,
        "Content-Type": "application/json"
      },

      body: JSON.stringify({
        code_id: id
      })
    }
  );

  if (response.ok) {
    viewAccessCodes();
  }
  else {
    console.error(await response.text());
    alert("FAILED TO DEACTIVATE CODE.");
  }

}


async function reactivateCode(id) {

  const response = await fetch(
    SUPABASE_URL +
    "/rest/v1/rpc/reactivate_access_code",
    {
      method: "POST",

      headers: {
        "apikey": SUPABASE_KEY,
        "Authorization":
          "Bearer " +
          window.overseerSession.access_token,
        "Content-Type": "application/json"
      },

      body: JSON.stringify({
        code_id: id
      })
    }
  );

  if (response.ok) {
    viewAccessCodes();
  }
  else {
    console.error(await response.text());
    alert("FAILED TO REACTIVATE CODE.");
  }

}
  
</script>
