<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Website Hub</title>

  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #111;
      color: white;
      text-align: center;
    }

    h1 {
      margin-top: 50px;
      font-size: 40px;
    }

    #buttons {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 15px;
      padding: 30px;
    }

    .site-button {
      background: #222;
      color: white;
      border: 2px solid #444;
      border-radius: 10px;
      padding: 15px 25px;
      font-size: 18px;
      cursor: pointer;
      transition: 0.2s;
    }

    .site-button:hover {
      background: #333;
      transform: scale(1.05);
    }
  </style>
</head>

<body>

  <h1>🌐 My Website Hub</h1>

  <div id="buttons"></div>

  <script>

    // ==========================================
    // ADD YOUR WEBSITES HERE
    // ==========================================

    const websites = [
      {
        name: "YouTube",
        url: "https://youtube.com"
      },

      {
        name: "Google",
        url: "https://google.com"
      },

      {
        name: "GitHub",
        url: "https://github.com"
      }

      // Add more websites below!
    ];


    // ==========================================
    // DON'T EDIT BELOW THIS LINE
    // ==========================================

    const buttonContainer = document.getElementById("buttons");

    websites.forEach(site => {

      const button = document.createElement("button");

      button.className = "site-button";
      button.textContent = site.name;

      button.onclick = () => {
        window.open(site.url, "_blank");
      };

      buttonContainer.appendChild(button);

    });

  </script>

</body>
</html>
