  /*
    ==========================================
       SUPABASE CONNECTION
    ==========================================

    IMPORTANT:

    Replace the placeholder below with your
    Supabase PUBLISHABLE key.

    NEVER put your service_role / secret key here.
  */

  const SUPABASE_URL =
    "https://jkvjwrylzbhtrjesgrxi.supabase.co";

  const SUPABASE_KEY =
    "sb_publishable_TCJ6M82hMRFbXc40djvk9Q_oA41lSvn";

window.supabaseClient = supabase.createClient(
    SUPABASE_URL,
    SUPABASE_KEY
);

  let websites = [];

  let currentCategory = "ALL";


  /*
    ==========================================
       DATABASE REQUEST
    ==========================================
  */

  async function databaseRequest(
    endpoint,
    options = {}
  ) {

    const response = await fetch(
      SUPABASE_URL + endpoint,
      {

        ...options,

        headers: {

          "apikey":
            SUPABASE_KEY,

          "Authorization":
            "Bearer " + SUPABASE_KEY,

          "Content-Type":
            "application/json",

          ...(options.headers || {})

        }

      }
    );

    return response;

  }


  /*
    ==========================================
       LOGIN
    ==========================================
  */

  async function login() {

    const code =
      document
        .getElementById("accessCode")
        .value
        .trim();
    
    // ☢️ SECRET OVERSEER COMMAND
if (code.toLowerCase() === "overseer") {
  showOverseerLogin();
  return;
}


    const message =
      document
        .getElementById("loginMessage");


    if (!code) {

      message.textContent =
        "ENTER AN ACCESS CODE.";

      return;

    }


    message.textContent =
      "AUTHENTICATING...";


    try {

      const response =
        await databaseRequest(
          "/rest/v1/rpc/use_access_code",
          {

            method: "POST",

            body:
              JSON.stringify({

                input_code: code

              })

          }
        );


      const result =
        await response.json();


      if (
        response.ok &&
        result.success
      ) {

        message.textContent =
          "ACCESS GRANTED.";

        document
          .getElementById("loginScreen")
          .classList.add("hidden");


        document
          .getElementById("hub")
          .classList.remove("hidden");


        loadWebsites();

      }

      else {

        message.textContent =
          result.message ||
          "ACCESS DENIED.";

      }

    }

    catch (error) {

      console.error(error);

      message.textContent =
        "CONNECTION ERROR.";

    }

  }


  /*
    ==========================================
       LOAD WEBSITES
    ==========================================
  */

 async function loadWebsites() {

  try {

    const response =
      await databaseRequest(
        "/rest/v1/websites?active=eq.true&select=id,name,url,category&order=name"
      );

    if (!response.ok) {

      throw new Error(
        "Database request failed"
      );

    }

    const existingWebsites =
      await response.json();


    const managedResponse =
      await databaseRequest(
        "/rest/v1/managed_websites?enabled=eq.true&select=id,name,url,description&order=name"
      );


    if (!managedResponse.ok) {

      throw new Error(
        "Managed website request failed"
      );

    }


    const managedWebsites =
      await managedResponse.json();


    const convertedManagedWebsites =
      managedWebsites.map(site => ({
        id: site.id,
        name: site.name,
        url: site.url,
        category: "MISC"
      }));


    websites = [
      ...existingWebsites,
      ...convertedManagedWebsites
    ];


    renderCategories();

    renderSites();

  }

  catch (error) {

    console.error(error);

    document
      .getElementById("sites")
      .innerHTML =
      "<p>DATABASE CONNECTION ERROR.</p>";

  }

}


  /*
    ==========================================
       CATEGORIES
    ==========================================
  */

  function renderCategories() {

    const categories =
      [
        "ALL",
        ...new Set(
          websites
            .map(site => site.category)
            .filter(Boolean)
        )
      ];


    document
      .getElementById("categories")
      .innerHTML =
        categories
          .map(category => `

            <button
              onclick="selectCategory('${escapeHTML(category)}')"
            >

              ${escapeHTML(category)}

            </button>

          `)
          .join("");

  }


  function selectCategory(category) {

    currentCategory =
      category;

    renderSites();

  }


  /*
    ==========================================
       DISPLAY WEBSITES
    ==========================================
  */

  function renderSites() {

    const search =
      document
        .getElementById("search")
        .value
        .toLowerCase();


    const filtered =
      websites.filter(site => {

        const matchesCategory =
          currentCategory === "ALL" ||
          site.category === currentCategory;


        const matchesSearch =
          (
            site.name +
            " " +
            site.url +
            " " +
            site.category
          )
          .toLowerCase()
          .includes(search);


        return (
          matchesCategory &&
          matchesSearch
        );

      });


    const container =
      document
        .getElementById("sites");


    if (!filtered.length) {

      container.innerHTML =
        "<p>NO RECORDS FOUND.</p>";

      return;

    }


    container.innerHTML =
      filtered
        .map(site => `

          <div
            class="site"
            onclick="openWebsite('${escapeAttribute(site.url)}')"
          >

            <div class="site-name">
              ${escapeHTML(site.name)}
            </div>

            <div class="site-category">
              ${escapeHTML(site.category || "MISC")}
            </div>

          </div>

        `)
        .join("");

  }


  /*
    ==========================================
       OPEN WEBSITE
    ==========================================
  */

  function openWebsite(url) {

    try {

      const parsed =
        new URL(url);


      if (
        parsed.protocol !== "https:" &&
        parsed.protocol !== "http:"
      ) {

        return;

      }


      window.open(
        parsed.href,
        "_blank",
        "noopener,noreferrer"
      );

    }

    catch {

      console.error(
        "Invalid website URL"
      );

    }

  }


  /*
    ==========================================
       LOG OUT
    ==========================================
  */

  function logout() {

    websites = [];

    currentCategory = "ALL";


    document
      .getElementById("hub")
      .classList.add("hidden");


    document
      .getElementById("loginScreen")
      .classList.remove("hidden");


    document
      .getElementById("accessCode")
      .value = "";


    document
      .getElementById("loginMessage")
      .textContent = "";

  }


  /*
    ==========================================
       SECURITY HELPERS
    ==========================================
  */

  function escapeHTML(value) {

    return String(value ?? "")
      .replace(
        /[&<>"']/g,
        character => ({

          "&": "&amp;",
          "<": "&lt;",
          ">": "&gt;",
          '"': "&quot;",
          "'": "&#039;"

        }[character])

      );

  }


  function escapeAttribute(value) {

    return String(value ?? "")
      .replace(
        /'/g,
        "%27"
      );

  }


  /*
    ENTER KEY LOGIN
  */

  document
    .getElementById("accessCode")
    .addEventListener(
      "keydown",
      event => {

        if (
          event.key === "Enter"
        ) {

          login();

        }

      }
    );

      <input

        autocomplete="current-password"
      >

      <button onclick="overseerLogin()">
        AUTHENTICATE
      </button>

      <button onclick="location.reload()">
        RETURN
      </button>

      <div
        id="overseerMessage"
        class="message"
      ></div>

    </div>
  `;

}


async function overseerLogin() {

  const email =
    document
      .getElementById("overseerEmail")
      .value
      .trim();

  const password =
    document
      .getElementById("overseerPassword")
      .value;


  const message =
    document
      .getElementById("overseerMessage");


  message.textContent =
    "AUTHENTICATING OVERSEER...";


  try {

    const response =
      await fetch(
        SUPABASE_URL +
        "/auth/v1/token?grant_type=password",
        {

          method: "POST",

          headers: {

            "apikey":
              SUPABASE_KEY,

            "Content-Type":
              "application/json"

          },

          body:
            JSON.stringify({

              email: email,
              password: password

            })

        }
      );


    const result =
      await response.json();


    if (!response.ok) {

      message.textContent =
        "OVERSEER AUTHENTICATION FAILED.";

      return;

    }


    // Check that this account is actually
    // registered as an Overseer.

    const check =
      await fetch(
        SUPABASE_URL +
        "/rest/v1/overseers?user_id=eq." +
        encodeURIComponent(result.user.id) +
        "&select=user_id",
        {

          headers: {

            "apikey":
              SUPABASE_KEY,

            "Authorization":
              "Bearer " +
              result.access_token

          }

        }
      );


    const overseers =
      await check.json();


    if (
      !check.ok ||
      !overseers.length
    ) {

      message.textContent =
        "ACCESS DENIED: NOT AN OVERSEER.";

      return;

    }


    message.textContent =
      "OVERSEER ACCESS GRANTED.";


    // Save the authenticated session.

    window.overseerSession = result;


    // Open the Overseer terminal.

    showOverseerPanel();

  }

  catch (error) {

    console.error(error);

    message.textContent =
      "SYSTEM CONNECTION ERROR.";

  }

}

  async function generateGuestCode() {

  const output =
    document.getElementById("overseerOutput");

  output.textContent =
    "GENERATING ACCESS CODE...";

  try {

    const response =
      await fetch(
        SUPABASE_URL +
        "/rest/v1/rpc/create_access_code",
        {

          method: "POST",

          headers: {
  "apikey": SUPABASE_KEY,
  "Authorization":
    "Bearer " + window.overseerSession.access_token,
  "Content-Type": "application/json"
},

body: JSON.stringify({
  p_request: "generate"
})

        }
      );

    async function viewAccessCodes() {

  const output =
    document.getElementById("overseerOutput");

  output.innerHTML =
    "LOADING ACCESS CODE DATABASE...";

  try {

    const response =
      await fetch(
        SUPABASE_URL +
        "/rest/v1/rpc/overseer_view_codes",
        {

          method: "POST",

          headers: {

            "apikey":
              SUPABASE_KEY,

            "Authorization":
              "Bearer " +
              window.overseerSession.access_token,

            "Content-Type":
              "application/json"

          },

        }
      );


    const codes =
      await response.json();


    if (!response.ok) {

      output.textContent =
        "DATABASE ACCESS FAILED.";

      console.error(codes);

      return;

    }


    if (!codes.length) {

      output.innerHTML =
        "<p>NO ACCESS CODES FOUND.</p>";

      return;

    }


    output.innerHTML = `

      <h3>☢ ACCESS CODE DATABASE</h3>

      <div id="codeDatabase"></div>

    `;


    const database =
      document.getElementById(
        "codeDatabase"
      );


    database.innerHTML =
      codes.map(code => {

        let status;

        if (code.uses_remaining <= 0) {

          status = "EXPIRED";

        }

        else if (!code.active) {

          status = "DEACTIVATED";

        }

        else {

          status = "ACTIVE";

        }


        let action = "";


        if (
          code.uses_remaining > 0 &&
          code.active
        ) {

          action = `

            <button
              onclick="deactivateCode('${code.id}')"
            >
              DEACTIVATE
            </button>

          `;

        }

        else if (
          code.uses_remaining > 0 &&
          !code.active
        ) {

          action = `

            <button
              onclick="reactivateCode('${code.id}')"
            >
              REACTIVATE
            </button>

          `;

        }


        return `

          <div
            style="
              border:1px solid #159615;
              padding:15px;
              margin:10px 0;
            "
          >

            <strong>
              CODE:
              ${escapeHTML(
                code.access_code ||
                "UNKNOWN / LEGACY CODE"
              )}
            </strong>

            <br>

            USES:
            ${code.uses_remaining}

            <br>

            STATUS:
            ${status}

            <br>

        CREATED:
${new Date(
  code.created_at
).toLocaleString()}

<br>

<div style="margin-top:5px;">
  LAST USED:
  ${
    code.last_used_at
      ? new Date(code.last_used_at).toLocaleString()
      : "NEVER"
  }
</div>

<br>
            ${action}

          </div>

        `;

      }).join("");

  }

  catch (error) {

    console.error(error);

    output.textContent =
      "SYSTEM ERROR.";

  }

}

    async function deactivateCode(id) {

  if (!confirm(
    "DEACTIVATE THIS ACCESS CODE?"
  )) {
    return;
  }


  const response =
    await fetch(
      SUPABASE_URL +
      "/rest/v1/rpc/deactivate_access_code",
      {

        method: "POST",

        headers: {

          "apikey":
            SUPABASE_KEY,

          "Authorization":
            "Bearer " +
            window.overseerSession.access_token,

          "Content-Type":
            "application/json"

        },

        body:
          JSON.stringify({
            code_id: id
          })

      }
    );


  if (response.ok) {

    viewAccessCodes();

  }

  else {

    alert(
      "FAILED TO DEACTIVATE CODE."
    );

  }

}

}


    const code =

    if (!response.ok) {

        USES REMAINING: 100
      </div>

      <div>
        STATUS: ACTIVE
      </div>

    `;

  }

  catch (error) {

    console.error(error);

}

async function addWebsite() {

  const name =
    document.getElementById("newSiteName")
      .value.trim();

  const url =
    document.getElementById("newSiteURL")
      .value.trim();

  const category =
    document.getElementById("newSiteCategory")
      .value.trim()
      .toUpperCase();


  if (!name || !url || !category) {

    document.getElementById("overseerOutput")
      .insertAdjacentHTML(
        "beforeend",

async function viewAccessCodes() {

  const output =
    document.getElementById("overseerOutput");

  output.innerHTML =
    "☢ LOADING ACCESS CODE DATABASE...";

  try {

    const response = await fetch(
      SUPABASE_URL +
      "/rest/v1/rpc/overseer_view_codes",
      {
        method: "POST",

        headers: {
          "apikey": SUPABASE_KEY,
          "Authorization":
            "Bearer " +
            window.overseerSession.access_token,
          "Content-Type": "application/json"
        },

        body: "{}"
      }
    );

    const codes = await response.json();

    if (!response.ok) {

      console.error(codes);

      output.innerHTML =
        "☢ DATABASE ACCESS FAILED.";

      return;
    }

    if (!codes.length) {

      output.innerHTML =
        "☢ NO ACCESS CODES FOUND.";

      return;
    }

    output.innerHTML = `
      <h3>☢ ACCESS CODE DATABASE</h3>
      <div id="codeDatabase"></div>
    `;

    const database =
      document.getElementById("codeDatabase");

    codes.forEach(code => {

      let status;

      if (code.uses_remaining <= 0) {
        status = "EXPIRED";
      }
      else if (!code.active) {
        status = "DEACTIVATED";
      }
      else {
        status = "ACTIVE";
      }

      const card =
        document.createElement("div");

      card.style.border =
        "1px solid #159615";

      card.style.padding =
        "15px";

      card.style.margin =
        "10px 0";

      const title =
        document.createElement("strong");

      title.textContent =
        "CODE: " +
        (code.access_code ||
         "UNKNOWN / LEGACY CODE");

      card.appendChild(title);

      card.appendChild(
        document.createElement("br")
      );

      card.appendChild(
        document.createTextNode(
          "USES: " +
          code.uses_remaining
        )
      );

      card.appendChild(
        document.createElement("br")
      );

      card.appendChild(
        document.createTextNode(
          "STATUS: " + status
        )
      );

      card.appendChild(
        document.createElement("br")
      );

const lastUsed =
  document.createElement("div");

lastUsed.textContent =
  "LAST USED: " +
  (
    code.last_used_at
      ? new Date(code.last_used_at).toLocaleString()
      : "NEVER"
  );

card.appendChild(lastUsed);

card.appendChild(
  document.createElement("br")
);
      
      if (
        code.uses_remaining > 0 &&
        code.active
      ) {

        const button =
          document.createElement("button");

        button.textContent =
          "DEACTIVATE";

        button.onclick = () =>
          deactivateCode(code.id);

        card.appendChild(button);

      }
      else if (
        code.uses_remaining > 0 &&
        !code.active
      ) {

        const button =
          document.createElement("button");

        button.textContent =
          "REACTIVATE";

        button.onclick = () =>
          reactivateCode(code.id);

        card.appendChild(button);
      }

      const deleteButton =
  document.createElement("button");

deleteButton.textContent =
  "PERMANENTLY DELETE";

deleteButton.style.marginLeft =
  "10px";

deleteButton.onclick = () =>
  deleteAccessCode(code.id);

card.appendChild(deleteButton);

      database.appendChild(card);

    });

  }

  catch (error) {

    console.error(error);

    output.innerHTML =
      "☢ SYSTEM ERROR.";

  }

}
